<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login — Just in Time</title>
    <link rel="stylesheet" href="style_login.css">
</head>
<body>
    <div class="login-container">
        <h2 id="titulo-auth">Entrar</h2>
        <div class="form-group" id="grupo-nome" style="display: none;">
            <label>Nome</label>
            <input type="text" id="input-nome" placeholder="Seu nome">
        </div>
        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="input-email" placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="input-senha" placeholder="••••••••">
        </div>
        <button class="btn-primary" id="btn-auth">Entrar</button>
        <button class="btn-warning" id="btn-toggle" style="width: 100%; margin-top: 8px;">Criar nova conta</button>
        <p class="erro" id="msg-erro"></p>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
